/* ---------------- Hitit Güneş Kursu — Ankara'nın simgesi ---------------- */
function SunDisc({ size = 48, color = "#B86F52" }) {
  const spokes = Array.from({ length: 8 });
  return (
    <svg width={size} height={size} viewBox="0 0 100 100" fill="none" aria-hidden="true">
      <circle cx="50" cy="50" r="40" stroke={color} strokeWidth="2.6" />
      <circle cx="50" cy="50" r="28" stroke={color} strokeWidth="1.6" />
      <circle cx="50" cy="50" r="6" fill={color} />
      {spokes.map((_, i) => {
        const rad = (i * 360 * Math.PI) / (spokes.length * 180);
        const cos = Math.cos(rad), sin = Math.sin(rad);
        const x1 = 50 + 28 * cos, y1 = 50 + 28 * sin;
        const x2 = 50 + 40 * cos, y2 = 50 + 40 * sin;
        const sx = 50 + 40 * cos, sy = 50 + 40 * sin;
        const px = 50 + 46 * cos, py = 50 + 46 * sin;
        return (
          <g key={i}>
            <line x1={x1} y1={y1} x2={x2} y2={y2} stroke={color} strokeWidth="2" />
            <line x1={sx} y1={sy} x2={px} y2={py} stroke={color} strokeWidth="1.3" />
            <circle cx={px} cy={py} r="3" fill={color} />
          </g>
        );
      })}
    </svg>
  );
}

/* AÇILIŞ EKRANI — Hüdhüd soldan yukarı, sonra sağa uçar, tepede    */
/* döner ve üç kez öter.                                            */
/* ============================================================== */
function SplashIntro({ onDone }) {
  const [notes, setNotes] = useState([]);
  const audioCtxRef = useRef(null);

  useEffect(() => {
    function beep() {
      try {
        if (!audioCtxRef.current) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          audioCtxRef.current = new Ctx();
        }
        const ctx = audioCtxRef.current;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(900, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1500, ctx.currentTime + 0.09);
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.16);
        osc.connect(gain).connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.18);
      } catch (e) {
        /* ses engellenmişse sessizce geç */
      }
    }

    // Kuş 40%'te merkeze varır, %40-66 arası kendi etrafında döner,
    // %66-88 yerinde durup öter (notalar bu evrede yükselir),
    // %88-100 sağa aşağı doğru süzülerek sahneden kaybolur.
    const symbolPool = ["♪", "♫", "♩", "♬", "♪", "♫"];
    const singTimes = [4300, 4700, 5100];
    const notesPerSing = 2;
    const timers = [];

    singTimes.forEach((t, i) => {
      timers.push(
        window.setTimeout(() => {
          beep();
          for (let k = 0; k < notesPerSing; k++) {
            timers.push(
              window.setTimeout(() => {
                const id = Date.now() + Math.random();
                const symbol = symbolPool[(i * notesPerSing + k) % symbolPool.length];
                const dx = (k === 0 ? -1 : 1) * (10 + i * 4 + k * 6);
                setNotes((prev) => [...prev, { id, symbol, dx }]);
                timers.push(
                  window.setTimeout(() => {
                    setNotes((prev) => prev.filter((n) => n.id !== id));
                  }, 1000)
                );
              }, k * 110)
            );
          }
        }, t)
      );
    });

    const done = window.setTimeout(onDone, 6500);
    timers.push(done);

    return () => timers.forEach(clearTimeout);
  }, [onDone]);

  return (
    <div className="fixed inset-0 z-50 splash-sky flex items-center justify-center overflow-hidden">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        .font-display { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; letter-spacing: -0.01em; }
        .font-body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
        .splash-sky {
          background: linear-gradient(180deg, #3A2A22 0%, #8C8A68 45%, #F3E7D8 100%);
        }
        .hoopoe-fly {
          position: absolute;
          left: 50%; top: 50%;
          animation: hoopoePath 6.2s cubic-bezier(.35,.02,.25,1) both;
        }
        /* 0-22%: soldan yukarı yüksel — 22-40%: sağa uçup merkeze var —
           40-66%: kendi etrafında daire çiz — 66-88%: yerinde dur ve öt —
           88-100%: sağa aşağı doğru süzülerek kaybol. */
        @keyframes hoopoePath {
          0%   { transform: translate(-230px, 160px) rotate(-6deg) scale(0.85); opacity: 0; }
          6%   { opacity: 1; }
          22%  { transform: translate(-210px, -40px) rotate(-2deg) scale(0.95); }
          40%  { transform: translate(0px, -160px) rotate(0deg) scale(1); }
          47%  { transform: translate(24px, -180px) rotate(14deg) scale(1); }
          55%  { transform: translate(-2px, -202px) rotate(-4deg) scale(1); }
          62%  { transform: translate(-22px, -168px) rotate(-14deg) scale(1); }
          66%  { transform: translate(0px, -160px) rotate(0deg) scale(1); }

        .music-note {
          position: absolute; top: -6px; right: 4px;

        }
        .brand-fade { animation: brandFade 6.5s ease both; }

          0%, 76% { opacity: 0; transform: translateY(6px); }

      `}</style>

      <div className="sun-pulse absolute" style={{ top: "18%" }}>
        <SunDisc size={70} color="#B86F52" />
      </div>

      <div className="hoopoe-fly">
        <Hoopoe size={70} />
        {notes.map((n) => (
          <MusicNote key={n.id} symbol={n.symbol} dx={n.dx} />

      </div>

      <div className="brand-fade absolute bottom-20 text-center px-8">
        <div className="font-display font-bold" style={{ fontSize: "2.6rem", color: "#3A2A22" }}>Ankara</div>
        <div className="font-body text-sm mt-1" style={{ color: "rgba(58,42,34,0.65)" }}>
          25 ilçe · gezi rehberi
        </div>
      </div>

      <button
        onClick={onDone}
        className="absolute bottom-6 right-6 font-mono text-xs px-3 py-1.5 rounded-full border"
        style={{ borderColor: "rgba(58,42,34,0.3)", color: "rgba(58,42,34,0.6)" }}
      >
        Atla
      </button>
    </div>
  );
}

function KindBadge({ kind }) {
  const isMerkez = kind === "merkez";
  return (
    <span
      className="font-mono text-xs px-2.5 py-1 rounded-full"
      style={{
        color: "#FBF6EF",
        background: isMerkez ? "#B86F52" : "#8C8A68",
      }}
    >
      {isMerkez ? "MERKEZ İLÇE" : "DIŞ İLÇE"}
    </span>
  );
}

function DistrictImage({ src, alt, credit }) {
  const [ok, setOk] = useState(true);
  if (!src) return null;
  return (
    <div className="rounded-xl overflow-hidden border mt-2 mb-1" style={{ borderColor: "rgba(58,42,34,0.15)" }}>
      {ok ? (
        <img
          src={src}
          alt={alt}
          className="w-full object-cover"
          style={{ height: 140 }}
          onError={() => setOk(false)}
        />
      ) : (
        <div
          className="w-full flex items-center justify-center"
          style={{ height: 140, background: "linear-gradient(180deg, #F3E7D8 0%, #D9BFA3 100%)" }}
        >
          <span className="font-body text-xs" style={{ color: "rgba(58,42,34,0.5)" }}>
            Fotoğraf bu önizlemede yüklenemedi
          </span>
        </div>
      )}
      {credit && (
        <div className="px-3 py-1" style={{ background: "#FBF6EF" }}>
          <span className="font-mono text-xs" style={{ color: "rgba(58,42,34,0.45)" }}>{credit}</span>
        </div>
      )}
    </div>
  );
}

function PlaceRow({ p }) {
  const cat = CATEGORIES.find((c) => c.key === p.cat);
  const catColor = CATEGORY_COLORS[p.cat] || "#8C8A68";
  return (
    <div
      className="jelly card-in mb-3"
      style={{ background: "#FBF6EF", borderRadius: 20, padding: "16px 18px", boxShadow: "0 6px 16px -10px rgba(58,42,34,0.28)" }}
    >
      <div className="flex items-center justify-between gap-2">
        <span className="font-display font-semibold text-sm">{p.name}</span>
        <span
          className="font-mono text-xs px-2 py-0.5 rounded-full shrink-0"
          style={{ background: catColor, color: "#FBF6EF" }}
        >
          {cat.short}
        </span>
      </div>
      <div className="text-xs mt-0.5" style={{ color: "rgba(58,42,34,0.5)" }}>{p.district}</div>
      <p className="font-body text-sm mt-1 leading-relaxed" style={{ color: "rgba(58,42,34,0.8)" }}>{p.desc}</p>
      {p.image && <DistrictImage src={p.image} alt={p.name} credit={p.imageCredit} />}
      {p.tip && (
        <div
          className="font-body text-xs mt-2 leading-relaxed rounded-xl px-3 py-2"
          style={{ background: "#EAD9C0", color: "rgba(58,42,34,0.85)" }}
        >
          <span className="font-semibold">💡 Tavsiye: </span>{p.tip}
        </div>
      )}
      <div className="flex gap-2 mt-2">
        <a
          href={mapsSearch(p.q)} target="_blank" rel="noreferrer"
          className="font-mono text-xs px-2.5 py-1 rounded-full border jelly"
          style={{ borderColor: "rgba(58,42,34,0.25)", color: "rgba(58,42,34,0.65)" }}
        >
          Haritada Gör
        </a>
        <a
          href={mapsDir(p.q)} target="_blank" rel="noreferrer"
          className="font-mono text-xs px-2.5 py-1 rounded-full jelly"
          style={{ background: "#B86F52", color: "#FBF6EF" }}
        >
          Yol Tarifi →
        </a>
      </div>
    </div>
  );
}

/* ============================================================== */
function App() {
  const [showSplash, setShowSplash] = useState(true);
  const [tab, setTab] = useState("ilceler"); // ilceler | gezi
  const [query, setQuery] = useState("");
  const [kindFilter, setKindFilter] = useState("all");
  const [sortBy, setSortBy] = useState("alpha");
  const [selectedNo, setSelectedNo] = useState(null);
  const [catFilter, setCatFilter] = useState("all");

  useEffect(() => {
    function onKey(e) { if (e.key === "Escape") setSelectedNo(null); }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  useEffect(() => {
    if (selectedNo != null) {
      const prevOverflow = document.body.style.overflow;
      const prevPosition = document.body.style.position;
      const prevWidth = document.body.style.width;
      const scrollY = window.scrollY;
      document.body.style.overflow = "hidden";
      document.body.style.position = "fixed";
      document.body.style.top = `-${scrollY}px`;
      document.body.style.width = "100%";
      return () => {
        document.body.style.overflow = prevOverflow;
        document.body.style.position = prevPosition;
        document.body.style.width = prevWidth;
        document.body.style.top = "";
        window.scrollTo(0, scrollY);
      };
    }
  }, [selectedNo]);

  const filteredDistricts = useMemo(() => {
    let list = DISTRICTS.filter((d) => d.name.toLocaleLowerCase("tr").includes(query.toLocaleLowerCase("tr")));
    if (kindFilter !== "all") list = list.filter((d) => d.kind === kindFilter);
    return [...list].sort((a, b) => (sortBy === "pop" ? b.pop - a.pop : a.name.localeCompare(b.name, "tr")));
  }, [query, kindFilter, sortBy]);

  const filteredPlaces = useMemo(() => {
    let list = PLACES;
    if (catFilter !== "all") list = list.filter((p) => p.cat === catFilter);
    if (query) list = list.filter((p) =>
      (p.name + p.district).toLocaleLowerCase("tr").includes(query.toLocaleLowerCase("tr"))
    );
    return list;
  }, [catFilter, query, tab]);

  const selected = DISTRICTS.find((d) => d.no === selectedNo) || null;
  const selectedPlaces = selected ? PLACES.filter((p) => p.district === selected.name) : [];
  const selectedInfo = selected ? DISTRICT_INFO[selected.name] : null;

  if (showSplash) return <SplashIntro onDone={() => setShowSplash(false)} />;

  return (
    <div className="min-h-screen bg-paper font-body text-ink pb-16">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
        .font-display { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; letter-spacing: -0.01em; }
        .font-body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
        .font-mono { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
        .bg-paper { background-color: #F3E7D8; }
        .text-ink { color: #3A2A22; }
        .card-paper { background: #FBF6EF; }
        @keyframes stampIn { 0% { opacity:0; transform: scale(1.7) rotate(-16deg);} 55%{opacity:1; transform: scale(0.93) rotate(-7deg);} 78%{transform: scale(1.04) rotate(-9deg);} 100%{opacity:1; transform: scale(1) rotate(-8deg);} }
        @keyframes stampPulse { 0%,100% { transform: scale(1) rotate(-8deg); } 50% { transform: scale(1.05) rotate(-8deg); } }
        .stamp-anim { animation: stampIn .55s cubic-bezier(.2,.8,.3,1) both, stampPulse 2.4s ease-in-out 0.6s infinite; }
        @keyframes sheetIn { from { transform: translateY(100%);} to { transform: translateY(0);} }
        .sheet-in { animation: sheetIn .42s cubic-bezier(.32,1.4,.44,1) both; }
        @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
        .fade-in { animation: fadeIn .2s ease both; }
        input::placeholder { color: rgba(58,42,34,0.4); }
        .chip-row::-webkit-scrollbar { display:none; }

        @keyframes cardFloat { 0%,100% { margin-top: 0px; } 50% { margin-top: -4px; } }
        .float { animation: cardFloat 4.6s ease-in-out infinite; }
        @keyframes cardIn { 0% { opacity:0; transform: translateY(18px) scale(.95); } 100% { opacity:1; transform: translateY(0) scale(1); } }
        .card-in { animation: cardIn .5s cubic-bezier(.22,.9,.25,1.35) both; }
        .card-in-float { animation: cardIn .5s cubic-bezier(.22,.9,.25,1.35) both, cardFloat 4.6s ease-in-out infinite; }
        .jelly { transition: transform .16s cubic-bezier(.34,1.56,.64,1); }
        .jelly:active { transform: scale(.94) rotate(-0.6deg); }

        }

        .btn3d-close:active {
          transform: scale(.90);
          box-shadow:
            0 1px 2px rgba(58,42,34,0.3) inset,
            0 -1px 2px rgba(255,255,255,0.4) inset,
            0 1px 1px rgba(58,42,34,0.15);
        }
        @keyframes blobDrift {
          0%,100% { transform: translate(0,0) scale(1); }

        }
        .blob { position:absolute; border-radius:50%; filter: blur(70px); opacity:.4; animation: blobDrift 16s ease-in-out infinite; }
      `}</style>

      <div className="fixed inset-0 pointer-events-none" style={{ zIndex: 0 }}>

        <div className="blob" style={{ width: "60vw", height: "60vw", right: "-20%", top: "35%", background: "#8C8A68", animationDelay: "-6s", animationPlayState: selected ? "paused" : "running" }} />
        <div className="blob" style={{ width: "50vw", height: "50vw", left: "10%", bottom: "-15%", background: "#B86F52", opacity: 0.18, animationDelay: "-11s", animationPlayState: selected ? "paused" : "running" }} />
      </div>

      <div className="relative" style={{ zIndex: 1 }}>

      {/* ---------- Hero ---------- */}
      <header className="px-5 pt-8 pb-4">

          <span
            className="font-mono text-xs tracking-widest px-3 py-1 rounded-full float"
            style={{ background: "#EAD9C0", color: "#4E3A28", animationPlayState: selected ? "paused" : "running" }}
          >
            T.C. · 06 · BAŞKENT
          </span>
          <span className="float" style={{ animationDelay: "-2s", animationPlayState: selected ? "paused" : "running" }}>
            <SunDisc size={30} color="#B86F52" />

        <h1 className="font-display font-bold leading-none card-in" style={{ fontSize: "2.6rem", color: "#3A2A22" }}>Ankara</h1>

          25 ilçenin tarihi yerleri, müzeleri, çarşıları, ören yerleri, gölleri, lezzetleri ve kamu binaları — harita ve yol tarifiyle.

        <div className="flex gap-2 mt-5">
          <button

                >
                  <span className="flex items-center gap-3 min-w-0">

        <div className="fixed inset-0 z-20 flex items-end justify-center fade-in">
          <div className="absolute inset-0" style={{ background: "rgba(58,42,34,0.45)" }} onClick={() => setSelectedNo(null)} />

            <div className="flex justify-between items-start">
              <span className="font-mono text-xs px-2.5 py-1 rounded-full" style={{ background: "#EAD9C0", color: "#4E3A28" }}>SİCİL NO {String(selected.no).padStart(2, "0")} / 25</span>
              <button onClick={() => setSelectedNo(null)} aria-label="Kapat" className="btn3d-close">

                <div className="mt-3">
                  <div className="font-display font-semibold text-sm" style={{ color: "#B86F52" }}>Coğrafya</div>
                  <p className="font-body text-sm mt-1 leading-relaxed">{selectedInfo.geography}</p>
                </div>
                <div className="mt-3">
                  <div className="font-display font-semibold text-sm" style={{ color: "#B86F52" }}>Ekonomi</div>
                  <p className="font-body text-sm mt-1 leading-relaxed">{selectedInfo.economy}</p>
                </div>
              </div>
            )}

            <div className="mt-5 pt-4 border-t" style={{ borderColor: "rgba(58,42,34,0.15)" }}>
              <span className="text-xs" style={{ color: "rgba(58,42,34,0.55)" }}>Gezilecek yerler</span>
              {selectedPlaces.length === 0 ? (
                <p className="font-body text-sm mt-2" style={{ color: "rgba(58,42,34,0.5)" }}>
                  Bu ilçe için henüz gezi rehberi kaydı eklenmedi.
                </p>
              ) : (
                <div className="mt-1">{selectedPlaces.map((p, i) => <PlaceRow key={i} p={p} />)}</div>
              )}
            </div>
          </div>
        </div>
      )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
